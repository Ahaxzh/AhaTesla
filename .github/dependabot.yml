version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
    ignore:
      # 构建链大版本手动升(dependabot 会直接改写 version range 跳大版本,
      # TS7/Vite8/Tailwind4 这类跳变曾在 PR #3 直接打破镜像构建;
      # Tailwind v4 是重写版:PostCSS 插件换 @tailwindcss/postcss + CSS-first 配置,需专项迁移)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: postcss
        update-types: ["version-update:semver-major"]
      - dependency-name: autoprefixer
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
