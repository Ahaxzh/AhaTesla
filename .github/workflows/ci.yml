name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test server
        working-directory: server
        run: |
          npm ci
          npm test
    strategy:
      matrix:
        # 22 = 上一个 LTS（存量部署兼容），26 = 当前 LTS（.nvmrc/Dockerfile 已跟随）
        node: [22, 26]

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test & build web
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

# e2e(Playwright)依赖真实 TeslaMate 数据库与隔离实例,不在 CI 运行;
# 本地跑法见 README「开发与测试」: bash scripts/run-e2e.sh
