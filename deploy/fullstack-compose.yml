# AhaTesla 全栈发行版（m4a）：AhaTesla + TeslaMate 一体化部署
# 适用：全新主机，没有现成 TeslaMate 的用户 —— 一条命令全套。
# 已有 TeslaMate 的用户请用 connect-compose.yml（轨道 B，直接挂你的现有网络）。
#
# 用法（务必带 --profile fullstack，不带则所有服务都不启动，防止半残栈）：
#   cd AhaTesla
#   cp deploy/.env.example.fullstack deploy/.env   # 只需填 2 个密钥（文件内附生成命令）
#   docker compose -f deploy/fullstack-compose.yml --profile fullstack up -d --build
#
# 然后浏览器打开 http://<主机IP>:18500 → /setup 向导：
#   注册管理员 → 按引导打开 http://<主机IP>:4000 登录特斯拉账号 → 回到向导等车出现 → 完成
#
# 端口说明：
#   18500  AhaTesla（默认仅绑 127.0.0.1；对外走 NPM HTTPS 反代，见 NPM-SETUP.md）
#   4000   TeslaMate 登录界面（默认仅绑 127.0.0.1）
#          ⚠ TeslaMate 的 Web 界面本身没有密码保护，且可下发车辆指令——
#          ⚠ 严禁直接改成 "4000:4000" 暴露到局域网/公网！远程主机请为 4000 配
#          ⚠ SSH 隧道（ssh -L 4000:127.0.0.1:4000 主机）或带认证的反代再访问。
#   5432   PostgreSQL 不对外，仅容器网络内可达
#
# 安全红线：teslamate 库对 AhaTesla 只读账号（init-ro 自动创建，独立密码
# TM_RO_PASSWORD，不与 teslamate 超级用户同密）；无公网端口。
name: ahatesla-fullstack

services:
  # ---------- TeslaMate 栈 ----------
  teslamate-db:
    image: postgres:17
    container_name: ahatesla-db
    restart: unless-stopped
    profiles: ["fullstack"]
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${TM_DB_PASSWORD:?请在 deploy/.env 设置 TM_DB_PASSWORD（生成命令见 .env.example.fullstack）}
      POSTGRES_DB: teslamate
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - tm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  teslamate-mqtt:
    image: eclipse-mosquitto:2
    container_name: ahatesla-mqtt
    restart: unless-stopped
    profiles: ["fullstack"]
    command: mosquitto -c /mosquitto-no-auth.conf
    # 允许本地匿名（仅容器网络内可达，不映射宿主端口）
    security_opt:
      - no-new-privileges:true

  teslamate:
    image: teslamate/teslamate:latest
    container_name: ahatesla-teslamate
    restart: unless-stopped
    profiles: ["fullstack"]
    depends_on:
      teslamate-db:
        condition: service_healthy
      teslamate-mqtt:
        condition: service_started
    environment:
      ENCRYPTION_KEY: ${TM_ENCRYPTION_KEY:?请在 deploy/.env 设置 TM_ENCRYPTION_KEY（openssl rand -base64 32）}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TM_DB_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: teslamate-db
      MQTT_HOST: teslamate-mqtt
      TZ: ${TZ:-Asia/Shanghai}
      # 中国区特斯拉 API 网关（可选，按需取消注释）
      # TESLA_API_HOST: https://tesla.cn
    volumes:
      - tm-import:/import
    ports:
      - "127.0.0.1:4000:4000"    # Tesla 登录界面（仅本机；远程访问走 SSH 隧道，见上）
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # 一次性：在 teslamate 库创建只读账号 + 权限收紧（幂等，跑完退出）
  init-ro:
    image: postgres:17
    profiles: ["fullstack"]
    depends_on:
      teslamate-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${TM_DB_PASSWORD}
    entrypoint: >
      sh -c '
        psql -h teslamate-db -U teslamate -d teslamate -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '\''ahatesla_ro'\'') THEN
              CREATE ROLE ahatesla_ro LOGIN PASSWORD '\''${TM_RO_PASSWORD:?请在 deploy/.env 设置 TM_RO_PASSWORD（生成命令见 .env.example.fullstack）}'\'';
            END IF;
          END \$\$;
          GRANT CONNECT ON DATABASE teslamate TO ahatesla_ro;
          GRANT USAGE ON SCHEMA public TO ahatesla_ro;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ahatesla_ro;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ahatesla_ro;
        " &&
        echo "read-only role ahatesla_ro ready"
      '
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # ---------- AhaTesla ----------
  ahatesla:
    # 预构建镜像(GHCR,多架构);本地改动想生效用 `up -d --build`
    image: ghcr.io/ahaxzh/ahatesla:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ahatesla-app
    restart: unless-stopped
    profiles: ["fullstack"]
    depends_on:
      teslamate-db:
        condition: service_healthy
      teslamate:
        condition: service_started
      init-ro:
        condition: service_completed_successfully
    environment:
      PORT: 18500
      TZ: ${TZ:-Asia/Shanghai}
      # 容器内必须监听 0.0.0.0（宿主端口映射才能进来；宿主侧仍只绑 127.0.0.1）
      HOST: 0.0.0.0
      DB_URL: postgres://ahatesla_ro:${TM_RO_PASSWORD:?TM_RO_PASSWORD 未设置}@teslamate-db:5432/teslamate
      MQTT_URL: mqtt://teslamate-mqtt:1883
      AHA_DATA_DIR: /data
      # 向导自动识别部署形态（跳过「已有/没有 TeslaMate」选择器）
      AHATESLA_DEPLOY_MODE: fullstack
    volumes:
      - ahatesla-data:/data
    ports:
      - "127.0.0.1:18500:18500"   # 仅本机；对外走 NPM HTTPS 反代（见 NPM-SETUP.md）
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:18500/api/system/health-lite || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  tm-db-data:
  tm-import:
  ahatesla-data:
