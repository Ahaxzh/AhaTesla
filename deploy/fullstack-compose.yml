# AhaTesla 全栈发行版（M3）：AhaTesla + TeslaMate 一体化部署
# 适用：全新主机，没有现成 TeslaMate 的用户。
# 已有 TeslaMate 的用户请用 connect-compose.yml（桥接模式，不动现有栈）。
#
# 用法：
#   cp .env.example.fullstack .env   # 编辑数据库密码等
#   docker compose -f deploy/fullstack-compose.yml --profile fullstack up -d
#
# 安全红线：teslamate 库对 AhaTesla 只读账号；桥接仅内网；无公网端口（经 NPM 反代）。
name: ahatesla-fullstack

services:
  # ---------- TeslaMate 栈（profile: fullstack） ----------
  teslamate-db:
    image: postgres:17
    container_name: ahatesla-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: ${TM_DB_PASSWORD:?请在 .env 设置 TM_DB_PASSWORD}
      POSTGRES_DB: teslamate
    volumes:
      - tm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  teslamate-mqtt:
    image: eclipse-mosquitto:2
    container_name: ahatesla-mqtt
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    # 允许本地匿名（仅容器网络内可达，不映射宿主端口）
    security_opt:
      - no-new-privileges:true

  teslamate:
    image: teslamate/teslamate:latest
    container_name: ahatesla-teslamate
    restart: unless-stopped
    profiles: ["fullstack"]
    depends_on:
      teslamate-db:
        condition: service_healthy
      teslamate-mqtt:
        condition: service_started
    environment:
      ENCRYPTION_KEY: ${TM_ENCRYPTION_KEY:?请在 .env 设置 TM_ENCRYPTION_KEY}
      DATABASE_USER: teslamate
      DATABASE_PASS: ${TM_DB_PASSWORD}
      DATABASE_NAME: teslamate
      DATABASE_HOST: teslamate-db
      MQTT_HOST: teslamate-mqtt
      # 中国区特斯拉 API 网关（可选，按需取消注释）
      # TESLA_API_HOST: https://tesla.cn
    volumes:
      - tm-import:/import
    security_opt:
      - no-new-privileges:true

  # ---------- AhaTesla ----------
  ahatesla:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ahatesla-app
    restart: unless-stopped
    depends_on:
      teslamate-db:
        condition: service_healthy
    environment:
      PORT: 18500
      DB_URL: postgres://ahatesla_ro:${TM_DB_PASSWORD}@teslamate-db:5432/teslamate
      MQTT_URL: mqtt://teslamate-mqtt:1883
      AHA_DATA_DIR: /data
      # 只读账号在首次启动时由 init-ro 自动创建（见下方 init-ro 服务）
    volumes:
      - ahatesla-data:/data
    ports:
      - "127.0.0.1:18500:18500"   # 仅本机；对外走 NPM HTTPS 反代
    security_opt:
      - no-new-privileges:true

  # 一次性：在 teslamate 库创建只读账号 + 权限收紧（幂等，跑完退出）
  init-ro:
    image: postgres:17
    profiles: ["fullstack"]
    depends_on:
      teslamate-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${TM_DB_PASSWORD}
    entrypoint: >
      sh -c '
        psql -h teslamate-db -U teslamate -d teslamate -c "
          DO \$\$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '\''ahatesla_ro'\'') THEN
              CREATE ROLE ahatesla_ro LOGIN PASSWORD '\''${TM_DB_PASSWORD}'\'';
            END IF;
          END \$\$;
          GRANT CONNECT ON DATABASE teslamate TO ahatesla_ro;
          GRANT USAGE ON SCHEMA public TO ahatesla_ro;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ahatesla_ro;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO ahatesla_ro;
        " &&
        echo "read-only role ahatesla_ro ready"
      '
    restart: "no"
    security_opt:
      - no-new-privileges:true

volumes:
  tm-db-data:
  tm-import:
  ahatesla-data:
